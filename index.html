<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brushwood Roleplay</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/CCheewwwy/brushwood-website/main/Brushwood_Logo_Glow.png">

  <style>
    :root {
      --black: #0a0a0a;
      --black-soft: #111;
      --green: #2ecc71;
      --green-glow: #3dff8a;
      --text-light: #e5e5e5;
      --text-dim: #9b9b9b;
    }

    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: var(--black);
      color: var(--text-light);
      overflow-x: hidden;
    }

    /* LOADING SCREEN */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--black);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    #loading-screen img {
      width: 140px;
      filter: drop-shadow(0 0 20px var(--green-glow));
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    #loading-screen.hide {
      opacity: 0;
      visibility: hidden;
    }

    /* PROGRESS BAR */
    #progress-bar {
      width: 220px;
      height: 10px;
      background: #0f0f0f;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--green-glow);
      box-shadow: 0 0 12px rgba(0, 255, 120, 0.4);
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green-glow);
      transition: width 0.2s linear;
    }

    /* MAIN CONTAINER TILT */
    #main-container {
      transition: transform 0.1s ease-out;
      will-change: transform;
      transform-style: preserve-3d;
      position: relative;
      z-index: 5;
    }

    /* PARTICLE BACKGROUND */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: var(--black);
    }

    /* NAVBAR */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.4rem 2.4rem;
      background: var(--black-soft);
      border-bottom: 1px solid #1a1a1a;
      position: relative;
      z-index: 10;
    }

    header img {
      height: 70px;
      filter: drop-shadow(0 0 12px var(--green-glow));
    }

    nav {
      display: flex;
      gap: 2.2rem;
    }

    nav a {
      text-decoration: none;
      color: var(--green);
      font-weight: 600;
      position: relative;
      font-size: 0.95rem;
      padding-bottom: 4px;
    }

    nav a::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--green-glow);
      transition: width 0.3s ease;
      box-shadow: 0 0 8px var(--green-glow);
    }

    nav a:hover::before {
      width: 100%;
    }

    nav a::after {
      content: "Coming Soon";
      position: absolute;
      top: 22px;
      left: 0;
      font-size: 0.65rem;
      color: var(--text-dim);
      font-weight: 400;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 9rem 2rem;
      background: radial-gradient(circle at top, #0f0f0f, #000);
      border-bottom-left-radius: 70px;
      border-bottom-right-radius: 70px;
      box-shadow: 0 0 40px rgba(0, 255, 120, 0.15);
      position: relative;
      z-index: 5;
    }

    .hero h1 {
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      margin-bottom: 1rem;
      font-weight: 800;
      color: var(--green-glow);
      text-shadow: 0 0 18px rgba(0, 255, 120, 0.4);
    }

    .hero p {
      font-size: 1.4rem;
      color: var(--text-dim);
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    #countdown {
      font-size: 1.8rem;
      color: var(--green);
      font-weight: 700;
      text-shadow: 0 0 12px var(--green-glow);
    }
  </style>
</head>

<body>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div id="loader-content">
      <img src="https://raw.githubusercontent.com/CCheewwwy/brushwood-website/main/Brushwood_Logo_Glow.png" alt="Loading">
      <div id="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- PARTICLES -->
  <canvas id="particles"></canvas>

  <!-- MAIN CONTENT -->
  <div id="main-container">

    <header>
      <img 
        src="https://raw.githubusercontent.com/CCheewwwy/brushwood-website/main/Brushwood_Logo_Glow.png"
        alt="Brushwood Roleplay Logo"
      />

      <nav>
        <a href="#">Server Info</a>
        <a href="#">Shop</a>
        <a href="#">Rules</a>
        <a href="#">Support</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Brushwood Roleplay</h1>
      <p>Coming March 2026</p>
      <div id="countdown"></div>
    </section>

  </div>

  <script>
    /* LOADING SCREEN WITH PROGRESS BAR — 3 second minimum */
    window.addEventListener("load", () => {
      const loader = document.getElementById("loading-screen");
      const fill = document.getElementById("progress-fill");

      const MIN_TIME = 3000; 
      const start = performance.now();

      // Animate progress bar over 3 seconds
      let progress = 0;
      const interval = setInterval(() => {
        progress += 1;
        fill.style.width = progress + "%";

        if (progress >= 100) {
          clearInterval(interval);
        }
      }, MIN_TIME / 100);

      function hideLoader() {
        const elapsed = performance.now() - start;

        if (elapsed >= MIN_TIME) {
          loader.classList.add("hide");
        } else {
          setTimeout(hideLoader, MIN_TIME - elapsed);
        }
      }

      hideLoader();
    });

    /* COUNTDOWN */
    const targetDate = new Date("March 1, 2026 00:00:00").getTime();
    setInterval(() => {
      const now = new Date().getTime();
      const diff = targetDate - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("countdown").innerHTML =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }, 1000);

    /* PARTICLES */
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3 + 1,
        speedX: (Math.random() - 0.5) * 0.4,
        speedY: (Math.random() - 0.5) * 0.4
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

        ctx.fillStyle = "rgba(0, 255, 120, 0.7)";
        ctx.shadowBlur = 12;
        ctx.shadowColor = "rgba(0, 255, 120, 0.8)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* MAIN CONTAINER TILT */
    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;

      const tiltX = y * -5;
      const tiltY = x * 5;

      const container = document.getElementById("main-container");
      container.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    });

    /* DEVTOOLS DETECTION + DMCA REDIRECT */
    (function() {
      let devtoolsOpen = false;
      const threshold = 160;

      setInterval(() => {
        const widthDiff = window.outerWidth - window.innerWidth > threshold;
        const heightDiff = window.outerHeight - window.innerHeight > threshold;

        if ((widthDiff || heightDiff) && !devtoolsOpen) {
          devtoolsOpen = true;
          window.location.href = "/dmca.html";
        }
      }, 500);
    })();
  </script>

</body>
</html>
